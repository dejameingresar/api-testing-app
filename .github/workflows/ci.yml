name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm start & npx wait-on http://localhost:3000/health
      - run: npx newman run tests/newman/collection.json -e tests/newman/environment.json
